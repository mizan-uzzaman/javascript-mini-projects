<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Counter</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <p id="page-title">Count Beyond the Horizon</p>
    <main id="main-container">
      <h1>Interactive Counter</h1>

      <p id="count-display" aria-live="polite">0</p>

      <div id="count-logic">
        <button id="decrease-btn" type="button">-</button>
        <button id="reset-btn" type="button">Reset</button>
        <button id="increase-btn" type="button">+</button>
      </div>

      <div id="step-control">
        <label for="step-input">Set Step Value:</label>
        <input type="number" id="step-input" value="1" min="1" step="1" />
      </div>

      <p id="keyboard-hint">
        Keyboard shortcuts: + to increase, - to decrease, 0 to reset.
      </p>
    </main>
  </body>
</html>
